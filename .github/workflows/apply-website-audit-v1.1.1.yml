name: Apply website content audit v1.1.1

on:
  push:
    branches: [website-audit-helper-v1.1.1]
    paths:
      - '.github/workflows/apply-website-audit-v1.1.1.yml'
      - 'scripts/apply_website_content_audit_v1_1_1.py'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve patcher and switch to target branch
        run: |
          cp scripts/apply_website_content_audit_v1_1_1.py /tmp/apply_website_content_audit.py
          git fetch origin website-content-audit-v1.1.1
          git checkout -B website-content-audit-v1.1.1 origin/website-content-audit-v1.1.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic content patches
        run: python /tmp/apply_website_content_audit.py
      - name: Build generated page contracts
        run: |
          node scripts/build_rolling_origin_revenue_backtest.mjs
          node scripts/build_page2_data.mjs
          node scripts/build_page3_data.mjs
          python scripts/build_page6_resources_data.py
          node scripts/build_page8_forecast_data.mjs
          python scripts/build_page10_dashboard_data.py
      - name: Validate page contracts and content alignment
        run: |
          node scripts/validate_rolling_origin_revenue_backtest.mjs
          node scripts/validate_page2_semantics.mjs
          node scripts/validate_page6_resources.mjs
          node scripts/validate_page8_forecast.mjs
          node scripts/validate_page10_dashboard.mjs
          node scripts/validate_website_content_alignment.mjs
          node scripts/validate_scope_boundaries.mjs
          node scripts/validate_evidence_taxonomy.mjs
          node scripts/validate_working_capital_semantics.mjs
      - name: Commit audit fixes to target branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site scripts reports data
          git commit -m "fix: align website Pages 1-10 with governed finance content"
          git push origin HEAD:website-content-audit-v1.1.1
