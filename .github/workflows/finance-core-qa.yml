name: Finance core QA

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  finance-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run final recruiter release QA
        run: node scripts/run_final_recruiter_release_qa.mjs
      - name: Upload finance core QA
        uses: actions/upload-artifact@v4
        with:
          name: finance-core-qa
          path: reports/RECRUITER_SITE_LINK_QA_FINAL.*
