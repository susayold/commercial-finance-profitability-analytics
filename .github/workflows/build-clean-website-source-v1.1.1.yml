name: Build clean website source v1.1.1

on:
  push:
    branches: [website-audit-helper-v1.1.1]
    paths:
      - '.github/workflows/build-clean-website-source-v1.1.1.yml'

permissions:
  contents: write

jobs:
  clean-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build clean source branch from v1.1.0
        run: |
          git fetch origin website-content-audit-v1.1.1 website-content-audit-clean-v1.1.1
          git checkout -B website-content-audit-clean-v1.1.1 origin/website-content-audit-clean-v1.1.1
          git checkout origin/website-content-audit-v1.1.1 -- \
            scripts/build_page10_dashboard_data.py \
            scripts/build_page8_forecast_data.mjs \
            scripts/run_final_recruiter_release_qa.mjs \
            scripts/validate_page10_dashboard.mjs \
            scripts/validate_page8_forecast.mjs \
            scripts/validate_website_content_alignment.mjs \
            site/app/cash-page7.tsx \
            site/app/commercial-page3.tsx \
            site/app/costing-page5.tsx \
            site/app/dashboard-page10.tsx \
            site/app/evidence-page9.tsx \
            site/app/executive-page1.tsx \
            site/app/forecast-page8.tsx \
            site/app/performance-page2.tsx \
            site/app/resources-page6.tsx \
            site/data/generated/page10-dashboard.json \
            site/data/generated/page8-forecast.json \
            site/data/generated/page9-evidence.json
      - name: Install and validate clean source
        run: |
          npm install --prefix site --ignore-scripts --no-audit --no-fund
          node scripts/run_final_recruiter_release_qa.mjs
          npm run build:github-pages --prefix site
      - name: Stage exact website audit allowlist
        run: |
          git reset
          git add -- \
            scripts/build_page10_dashboard_data.py \
            scripts/build_page8_forecast_data.mjs \
            scripts/run_final_recruiter_release_qa.mjs \
            scripts/validate_page10_dashboard.mjs \
            scripts/validate_page8_forecast.mjs \
            scripts/validate_website_content_alignment.mjs \
            site/app/cash-page7.tsx \
            site/app/commercial-page3.tsx \
            site/app/costing-page5.tsx \
            site/app/dashboard-page10.tsx \
            site/app/evidence-page9.tsx \
            site/app/executive-page1.tsx \
            site/app/forecast-page8.tsx \
            site/app/performance-page2.tsx \
            site/app/resources-page6.tsx \
            site/data/generated/page10-dashboard.json \
            site/data/generated/page8-forecast.json \
            site/data/generated/page9-evidence.json
          git diff --cached --name-only > /tmp/staged.txt
          cat /tmp/staged.txt
          python - <<'PY'
          from pathlib import Path
          allowed = {
            'scripts/build_page10_dashboard_data.py','scripts/build_page8_forecast_data.mjs',
            'scripts/run_final_recruiter_release_qa.mjs','scripts/validate_page10_dashboard.mjs',
            'scripts/validate_page8_forecast.mjs','scripts/validate_website_content_alignment.mjs',
            'site/app/cash-page7.tsx','site/app/commercial-page3.tsx','site/app/costing-page5.tsx',
            'site/app/dashboard-page10.tsx','site/app/evidence-page9.tsx','site/app/executive-page1.tsx',
            'site/app/forecast-page8.tsx','site/app/performance-page2.tsx','site/app/resources-page6.tsx',
            'site/data/generated/page10-dashboard.json','site/data/generated/page8-forecast.json',
            'site/data/generated/page9-evidence.json'
          }
          staged = {x.strip() for x in Path('/tmp/staged.txt').read_text().splitlines() if x.strip()}
          extra = sorted(staged - allowed)
          if extra:
              raise SystemExit('Unexpected staged files: ' + ', '.join(extra))
          if not staged:
              raise SystemExit('No website audit files staged')
          print(f'Staged allowlist PASS: {len(staged)} files')
          PY
      - name: Commit clean source snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: cleanly align website Pages 1-10 with finance contracts"
          git push origin HEAD:website-content-audit-clean-v1.1.1
