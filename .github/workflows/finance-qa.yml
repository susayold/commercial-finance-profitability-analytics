name: Finance model QA

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  finance-qa:
    name: Leakage, panel and contract checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate committed Power BI refresh fixture
        shell: bash
        run: |
          python scripts/validate_vietnova_data.py --input-dir powerbi/data/current
          python scripts/validate_powerbi_input_contract.py \\
            --input-dir powerbi/data/current \\
            --report "$RUNNER_TEMP/committed_powerbi_input_contract_QA.md"
          python scripts/generate_vietnova_data.py --output-dir "$RUNNER_TEMP/vnfinance_powerbi_committed_rebuild"
          python -c "from pathlib import Path; from scripts.build_powerbi_refreshable_project import create_source_control; create_source_control(Path(r'$RUNNER_TEMP/vnfinance_powerbi_committed_rebuild'))"
          diff -ru --exclude='README.md' powerbi/data/current "$RUNNER_TEMP/vnfinance_powerbi_committed_rebuild"

      - name: Validate refreshable Power BI package
        shell: bash
        run: |
          python scripts/generate_vietnova_data.py --output-dir "$RUNNER_TEMP/vnfinance_powerbi_data"
          python -c "from pathlib import Path; from scripts.build_powerbi_refreshable_project import create_source_control; create_source_control(Path(r'$RUNNER_TEMP/vnfinance_powerbi_data'))"
          python scripts/validate_vietnova_data.py --input-dir "$RUNNER_TEMP/vnfinance_powerbi_data"
          python scripts/validate_powerbi_input_contract.py \
            --input-dir "$RUNNER_TEMP/vnfinance_powerbi_data" \
            --report "$RUNNER_TEMP/powerbi_input_contract_QA.md"
          python scripts/validate_powerbi_refreshable_project.py \
            --pbit powerbi/releases/Commercial_Finance_Profitability_Analytics.pbit \
            --pbip powerbi/native/VNFinance_PBIP \
            --pbixproj powerbi/native/VNFinance_PbixProj \
            --data-dir "$RUNNER_TEMP/vnfinance_powerbi_data" \
            --report "$RUNNER_TEMP/powerbi_refreshable_package_QA.md"

      - name: Upload Power BI QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: powerbi-refreshable-qa
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/powerbi_input_contract_QA.md
            ${{ runner.temp }}/powerbi_refreshable_package_QA.md
            ${{ runner.temp }}/powerbi_artifact_coherence_QA.md
            powerbi/DIRECTQUERY_READINESS.json
            reports/POWER_BI_DIRECTQUERY_READINESS_QA.md

      - name: Forecast accuracy unit test
        shell: bash
        run: |
          node scripts/compute_forecast_accuracy.mjs \
            data/forecast_accuracy_unit_test.csv \
            "$RUNNER_TEMP/forecast_accuracy_unit_test_output.csv" \
            2025-03-31
          diff -u data/forecast_accuracy_unit_test_expected.csv "$RUNNER_TEMP/forecast_accuracy_unit_test_output.csv"

      - name: Frozen forecast capture archive QA
        shell: bash
        run: |
          node scripts/build_forecast_capture_demo_archive.mjs \
            data/forecast_accuracy_demo_input.csv \
            "$RUNNER_TEMP/forecast_snapshot_capture_demo_frozen.csv" \
            2025-12-31
          node scripts/validate_forecast_capture_archive.mjs \
            "$RUNNER_TEMP/forecast_snapshot_capture_demo_frozen.csv" \
            "$RUNNER_TEMP/forecast_capture_archive_QA.md"
          grep -F "**Overall status: PASS** (14/14 checks passed)" "$RUNNER_TEMP/forecast_capture_archive_QA.md"

      - name: CAPEX and fixed-asset planning QA
        shell: bash
        run: |
          node scripts/validate_capex_fixed_asset_planning.mjs \
            data/capex_fixed_asset_planning_synthetic.csv \
            docs/CAPEX_FIXED_ASSET_PLANNING_MODULE.md \
            "$RUNNER_TEMP/capex_QA.md"

      - name: OPEX and headcount planning QA
        shell: bash
        run: |
          node scripts/validate_opex_headcount_planning.mjs \
            data/opex_headcount_planning_synthetic.csv \
            docs/OPEX_HEADCOUNT_PLANNING_MODULE.md \
            "$RUNNER_TEMP/opex_headcount_QA.md"

      - name: Gate A intake contract QA
        shell: bash
        run: |
          node scripts/validate_gate_a_intake_contract.mjs \
            data/forecast_snapshot_gate_a_intake_template.csv \
            "$RUNNER_TEMP/gate_a_template_QA.md" \
            --mode=template
          node scripts/validate_gate_a_intake_contract.mjs \
            data/forecast_snapshot_gate_a_unit_test.csv \
            "$RUNNER_TEMP/gate_a_fixture_QA.md" \
            --mode=fixture

      - name: Gate A fixture accuracy report
        shell: bash
        run: |
          node scripts/build_live_forecast_accuracy_report.mjs \
            data/forecast_snapshot_gate_a_unit_test.csv \
            "$RUNNER_TEMP/gate_a_accuracy_fixture_report.md" \
            --mode=fixture
          grep -F "Release status: **FIXTURE_PASS_NOT_LIVE**" "$RUNNER_TEMP/gate_a_accuracy_fixture_report.md"

      - name: D2C unit economics QA
        shell: bash
        run: |
          node scripts/validate_d2c_unit_economics.mjs data/d2c_unit_economics_synthetic.csv

      - name: VNM public guidance proxy QA
        shell: bash
        run: |
          node scripts/validate_public_guidance_proxy.mjs data/vnm_public_guidance_proxy_2018_2025.csv

      - name: VNM public guidance analysis QA
        shell: bash
        run: |
          node scripts/analyze_public_guidance_proxy.mjs \
            data/vnm_public_guidance_proxy_2018_2025.csv \
            "$RUNNER_TEMP/vnm_public_guidance_proxy_analysis.json"
          node scripts/validate_public_guidance_proxy_analysis.mjs \
            "$RUNNER_TEMP/vnm_public_guidance_proxy_analysis.json"

      - name: VNM long-run panel QA
        shell: bash
        run: |
          node scripts/validate_vnm_longrun_panel.mjs \
            data/vnm_longrun_panel_2006_2025.csv \
            "$RUNNER_TEMP/vnm_longrun_panel_QA.md"
          grep -F "**Overall status: PASS** (17/17 checks passed)" "$RUNNER_TEMP/vnm_longrun_panel_QA.md"

      - name: Peer evidence QA
        shell: bash
        run: |
          node scripts/validate_peer_evidence.mjs \
            data/peer_benchmark_approved_2016_2025.csv \
            data/peer_extraction_queue.csv \
            data/vnm_statement_metrics_2006_2020.csv \
            "$RUNNER_TEMP/peer_evidence_QA.md"
          grep -F "**Overall status: PASS** (21/21 checks passed)" "$RUNNER_TEMP/peer_evidence_QA.md"

      - name: Validate normalized peer panel
        shell: bash
        run: |
          node scripts/validate_normalized_peer_panel.mjs data/normalized_peer_panel_approved_2016_2025.csv --mode=approved
          node scripts/validate_normalized_peer_panel.mjs data/normalized_peer_panel_intake_template.csv --mode=template

      - name: Validate MCH OCR review workbench
        shell: bash
        run: |
          node scripts/validate_mch_ocr_workbench.mjs data/mch_ocr_review_workbench_template.csv

      - name: Validate MCH credit memo trend layer
        shell: bash
        run: |
          node scripts/validate_mch_credit_memo.mjs \
            data/mch_finance_analyst_trend_2016_2025.csv \
            "$RUNNER_TEMP/mch_credit_memo_QA.md"
          grep -F "**Overall status: PASS** (15/15 checks passed)" "$RUNNER_TEMP/mch_credit_memo_QA.md"

      - name: Validate QNS/KDC basis perimeter bridge
        run: |
          node scripts/validate_peer_basis_perimeter_bridge.mjs data/peer_basis_perimeter_bridge_2016_2025.csv

      - name: Validate QNS/KDC adjustment feasibility ledger
        shell: bash
        run: |
          node scripts/validate_peer_basis_adjustment_feasibility.mjs

      - name: Validate PBIP source manifest
        shell: bash
        run: |
          node scripts/validate_pbip_source_manifest.mjs

      - name: Validate Power BI source coherence
        shell: bash
        run: |
          node scripts/validate_powerbi_source_coherence.mjs \
            powerbi/PBIP_SOURCE_MANIFEST.json \
            powerbi/model_contract.json \
            powerbi/measures.dax \
            powerbi/QA_TEST_MATRIX.md \
            powerbi/QA_EVIDENCE_LOG_TEMPLATE.csv

      - name: Validate generated PBIP/PBIT artifact coherence
        shell: bash
        run: |
          python scripts/validate_powerbi_artifact_coherence.py \
            --report "$RUNNER_TEMP/powerbi_artifact_coherence_QA.md"

      - name: Validate M&A accretion dilution case
        shell: bash
        run: |
          node scripts/validate_mna_accretion_dilution.mjs

      - name: Validate master plan evidence matrix
        shell: bash
        run: |
          node scripts/validate_master_plan_evidence_matrix.mjs

      - name: Validate external gate readiness
        shell: bash
        run: |
          node scripts/validate_external_gate_readiness.mjs data/external_gate_readiness.json | tee external-gate-readiness-qa.txt
          grep -F "External gate readiness QA: 10/10 checks PASS" external-gate-readiness-qa.txt

      - name: Validate customer profitability layer
        shell: bash
        run: |
          node scripts/validate_customer_profitability.mjs \
            data/customer_profitability_synthetic.csv \
            "$RUNNER_TEMP/customer_profitability_QA.md"
          grep -F "Customer profitability QA: 10/10 checks PASS" "$RUNNER_TEMP/customer_profitability_QA.md"

      - name: Validate inventory quality schedule
        shell: bash
        run: |
          node scripts/validate_inventory_quality.mjs \
            data/inventory_quality_synthetic.csv \
            "$RUNNER_TEMP/inventory_quality_QA.md"
          grep -F "Inventory quality QA: 9/9 checks PASS" "$RUNNER_TEMP/inventory_quality_QA.md"

      - name: Validate liquidity stress schedule
        shell: bash
        run: |
          node scripts/validate_liquidity_stress.mjs \
            data/liquidity_stress_synthetic.csv \
            "$RUNNER_TEMP/liquidity_stress_QA.md"
          grep -F "Liquidity stress QA: 9/9 checks PASS" "$RUNNER_TEMP/liquidity_stress_QA.md"

      - name: Validate Block A design lock
        shell: bash
        run: |
          node scripts/validate_block_a_design_lock.mjs data/block_a_design_lock.csv

      - name: Validate role alignment matrix
        shell: bash
        run: |
          node scripts/validate_role_alignment_matrix.mjs

      - name: Run cross-platform finance QA runner
        shell: bash
        run: |
          node scripts/run_finance_qa.mjs

      - name: Promotion ROI QA
        shell: bash
        run: |
          node scripts/validate_promotion_roi.mjs data/promotion_roi_synthetic.csv

      - name: Fixed-budget reallocation QA
        shell: bash
        run: |
          node scripts/validate_budget_reallocation.mjs data/budget_reallocation_synthetic.csv

      - name: Pricing simulator QA
        shell: bash
        run: |
          node scripts/validate_pricing_simulator.mjs data/pricing_simulator_synthetic.csv

      - name: Validate Power BI model contract JSON
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const contract = JSON.parse(fs.readFileSync("powerbi/model_contract.json", "utf8"));
          if (!Array.isArray(contract.dimensions) || contract.dimensions.length === 0) throw new Error("model contract has no dimensions");
          if (!Array.isArray(contract.facts) || contract.facts.length === 0) throw new Error("model contract has no facts");
          if (!Array.isArray(contract.pages) || contract.pages.length === 0) throw new Error("model contract has no report pages");
          if (!Array.isArray(contract.relationships) || contract.relationships.length === 0) throw new Error("model contract has no relationships");
          console.log(JSON.stringify({dimensions: contract.dimensions.length, facts: contract.facts.length, pages: contract.pages.length, relationships: contract.relationships.length, status: "PASS"}));
          NODE


      - name: Validate MCH financial statement analysis
        shell: bash
        run: |
          node scripts/validate_mch_financial_statement_analysis.mjs data/mch_financial_statement_analysis_2016_2025.csv


      - name: Validate MCH FY2017 indexed evidence boundary
        shell: bash
        run: |
          node scripts/validate_mch_fy2017_web_evidence.mjs \
            data/mch_fy2017_web_index_evidence.csv \
            reports/MCH_FY2017_WEB_INDEX_EVIDENCE_QA.md

      - name: Validate peer financial quality scorecard
        shell: bash
        run: |
          node scripts/validate_peer_financial_quality_scorecard.mjs data/peer_financial_quality_scorecard_2020_2025.csv

      - name: Validate Monthly Business Review operating pack
        shell: bash
        run: |
          node scripts/validate_monthly_business_review.mjs \
            reports/MONTHLY_BUSINESS_REVIEW_FINANCE_ANALYST_2026-08-30.md \
            data/monthly_business_review_kpi_pack_2026-08-30.csv

      - name: Validate Finance Analyst KPI dictionary
        shell: bash
        run: |
          node scripts/validate_finance_analyst_kpi_dictionary.mjs \
            docs/FINANCE_ANALYST_KPI_DICTIONARY.md \
            data/finance_analyst_kpi_dictionary.csv

      - name: Validate management recommendation register
        shell: bash
        run: |
          node scripts/validate_management_recommendation_register.mjs \
            reports/MANAGEMENT_RECOMMENDATION_REGISTER_2026-08-30.md \
            data/management_recommendation_register_2026-08-30.csv

      - name: Validate Finance Business Partnering battle cards v2
        shell: bash
        run: |
          node scripts/validate_battle_cards_v2.mjs \
            docs/BATTLE_CARDS_V2.md \
            data/battle_cards_v2.csv

      - name: Validate monthly close and business partnering calendar
        shell: bash
        run: |
          node scripts/validate_monthly_close_calendar.mjs \
            docs/MONTHLY_CLOSE_FORECAST_BUSINESS_PARTNERING_CALENDAR.md \
            data/monthly_close_forecast_business_partnering_calendar.csv

      - name: Validate Monte Carlo risk overlay output
        shell: bash
        run: |
          node scripts/validate_monte_carlo_risk_overlay.mjs \
            reports/MONTE_CARLO_RISK_OVERLAY_2026-08-30.md \
            data/monte_carlo_risk_overlay_2026-08-30.csv

      - name: Validate operational driver tree and unit economics
        shell: bash
        run: |
          node scripts/validate_operational_driver_tree.mjs \
            docs/OPERATIONAL_DRIVER_TREE_UNIT_ECONOMICS.md \
            data/operational_driver_tree_unit_economics.csv
